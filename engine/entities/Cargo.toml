[package]
name = "entities"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Entities, their typed components, items and inventories: the server's model of things that are not voxels."

[features]
# Property-test strategies for downstream crates' tests.
test-support = ["dep:proptest", "voxel_space/test-support"]

[dependencies]
binary_codec.workspace = true
namespaced_id.workspace = true
protocol.workspace = true
thiserror.workspace = true
voxel_space.workspace = true
proptest = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
voxel_space = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
