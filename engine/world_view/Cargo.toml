[package]
name = "world_view"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Turns a world into what a viewer draws: meshes kept up to date in the background, and rays cast through voxels."

[dependencies]
block_models.workspace = true
coarse_cells.workspace = true
region_octree.workspace = true
terrain.workspace = true
voxel_grid.workspace = true
voxel_meshing.workspace = true
voxel_space.workspace = true
world_storage.workspace = true

[dev-dependencies]
terrain = { workspace = true, features = ["test-support"] }
content_registry.workspace = true
proptest.workspace = true
voxel_grid = { workspace = true, features = ["test-support"] }
world_storage = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
