[package]
name = "data_packs"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Packs of JSON that add blocks and patch others: the reader, the loader, the patch applier and the generated schema, with errors that name the file and the path in it."

[dependencies]
block_models.workspace = true
libm = "0.2"
namespaced_id.workspace = true
pack_archive = { workspace = true, features = ["import"] }
png = "0.18.1"
serde_json.workspace = true
voxel_space.workspace = true

[dev-dependencies]
jsonschema.workspace = true
proptest.workspace = true
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
