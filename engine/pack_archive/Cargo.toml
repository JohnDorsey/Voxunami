[package]
name = "pack_archive"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The canonical archive of a pack: one byte sequence for one set of files, a strict reader that refuses anything else, and the file index and root hash that name a pack's identity."

[features]
# Reading an author's own zip (deflated, with folders, a wrapper folder, a Mac's `__MACOSX`) and writing the canonical archive of it. Off by default: the
# strict reader is all a client needs, and this pulls in the `zip` crate with a pure-Rust deflate (no C, no compression written).
import = ["dep:zip"]

[dependencies]
# `pure`: Rust intrinsics only, no C and no assembly is built into it (its build script still asks the C compiler what flags it takes).
blake3 = { version = "1", features = ["pure"] }
crc32fast = "1"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true

[[test]]
name = "import"
required-features = ["import"]
