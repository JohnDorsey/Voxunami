[package]
name = "coarse_streaming"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Coarse levels of detail in the stream: the messages a client and a server send about how far things are drawn and the coarse nodes that differ from what a client derives, and the plugins that send and use them."

[dependencies]
