[package]
name = "identity"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "A player's identity: a keypair per install, and the proof of holding it that a server asks for when a player connects."

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
namespaced_id.workspace = true
protocol.workspace = true
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
