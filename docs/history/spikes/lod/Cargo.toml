# Throwaway levels-of-detail experiments (see ../../lod-spike.md). A standalone project, not part of the
# workspace: `cd docs/history/spikes/lod && cargo run --release -- help`.
[package]
name = "lod_spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
coarse_cells = { path = "../../../../engine/coarse_cells" }
glam = "0.34.1"
png = "0.18.1"
pollster = "1.0.1"
region_octree = { path = "../../../../engine/region_octree" }
renderer = { path = "../../../../engine/renderer" }
terrain = { path = "../../../../engine/terrain" }
voxel_grid = { path = "../../../../engine/voxel_grid", features = ["test-support"] }
voxel_meshing = { path = "../../../../engine/voxel_meshing" }
voxel_space = { path = "../../../../engine/voxel_space" }
wgpu = "30.0.1"

[profile.release]
debug = false
