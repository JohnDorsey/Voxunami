[workspace]
resolver = "3"
members = ["engine/*", "plugins/*", "games/*", "launcher"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# Internal crates
base_blocks = { path = "plugins/base_blocks" }
block_models = { path = "engine/block_models" }
binary_codec = { path = "engine/binary_codec" }
client = { path = "engine/client" }
coarse_cells = { path = "engine/coarse_cells" }
coarse_streaming = { path = "engine/coarse_streaming" }
content_registry = { path = "engine/content_registry" }
data_packs = { path = "engine/data_packs" }
entities = { path = "engine/entities" }
game_shell = { path = "engine/game_shell" }
grid_bodies = { path = "engine/grid_bodies" }
grid_lifecycle = { path = "engine/grid_lifecycle" }
identity = { path = "engine/identity" }
lattice = { path = "engine/lattice" }
end_to_end_tests = { path = "engine/end_to_end_tests" }
namespaced_id = { path = "engine/namespaced_id" }
physics = { path = "engine/physics" }
player_presence = { path = "engine/player_presence" }
plugin_host = { path = "engine/plugin_host" }
protocol = { path = "engine/protocol" }
region_octree = { path = "engine/region_octree" }
replay = { path = "engine/replay" }
renderer = { path = "engine/renderer" }
server = { path = "engine/server" }
terrain = { path = "engine/terrain" }
transport = { path = "engine/transport" }
ui = { path = "engine/ui" }
voxel_grid = { path = "engine/voxel_grid" }
voxel_meshing = { path = "engine/voxel_meshing" }
voxel_space = { path = "engine/voxel_space" }
voxunami_2048 = { path = "games/voxunami_2048" }
voxunami_cave = { path = "games/voxunami_cave" }
voxunami_eels = { path = "games/voxunami_eels" }
wide_float = { path = "engine/wide_float" }
wide_kepler = { path = "engine/wide_kepler" }
world_view = { path = "engine/world_view" }
world_storage = { path = "engine/world_storage" }

# External crates
font8x8 = { version = "0.3", default-features = false }
# LGPL-3.0: only `engine/wide_float` names these (the number layer; `docs/orbits-and-thrust-plan.md`, E4 and E6). Every function it uses is correctly
# rounded, so any version that passes that crate's conformance tests gives the same bits.
malachite-base = "0.14"
malachite-float = "0.14"
malachite-nz = "0.14"
malachite-q = "0.14"
proptest = "1"
rustc-hash = "2"
jsonschema = { version = "0.59", default-features = false }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
# Crates that genuinely need unsafe (e.g. SIMD kernels) opt in locally with a justification.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Voxel code is far too slow unoptimized to test or play; keep debug assertions and overflow checks on.
[profile.dev]
opt-level = 1
# Line tables keep file and line in a backtrace; full debug information made a cold build of Cave's tests 277 s and 11.4 GB against 167 s and 4.1 GB (measured 2026-10-31).
# Set `debug = true` to step through the code with a debugger and see its variables.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
