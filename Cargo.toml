[workspace]
resolver = "3"
members = ["engine/*", "plugins/*", "games/*", "launcher"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# Internal crates
base_blocks = { path = "plugins/base_blocks" }
block_models = { path = "engine/block_models" }
binary_codec = { path = "engine/binary_codec" }
client = { path = "engine/client" }
content_registry = { path = "engine/content_registry" }
entities = { path = "engine/entities" }
game_shell = { path = "engine/game_shell" }
identity = { path = "engine/identity" }
lattice = { path = "engine/lattice" }
end_to_end_tests = { path = "engine/end_to_end_tests" }
namespaced_id = { path = "engine/namespaced_id" }
physics = { path = "engine/physics" }
player_presence = { path = "engine/player_presence" }
plugin_host = { path = "engine/plugin_host" }
protocol = { path = "engine/protocol" }
region_octree = { path = "engine/region_octree" }
replay = { path = "engine/replay" }
renderer = { path = "engine/renderer" }
server = { path = "engine/server" }
terrain = { path = "engine/terrain" }
transport = { path = "engine/transport" }
voxel_grid = { path = "engine/voxel_grid" }
voxel_meshing = { path = "engine/voxel_meshing" }
voxel_space = { path = "engine/voxel_space" }
voxunami_2048 = { path = "games/voxunami_2048" }
voxunami_cave = { path = "games/voxunami_cave" }
voxunami_eels = { path = "games/voxunami_eels" }
world_view = { path = "engine/world_view" }
world_storage = { path = "engine/world_storage" }

# External crates
proptest = "1"
rustc-hash = "2"
thiserror = "2"

[workspace.lints.rust]
# Crates that genuinely need unsafe (e.g. SIMD kernels) opt in locally with a justification.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Voxel code is far too slow unoptimized to test or play; keep debug assertions and overflow checks on.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
