# Terrain generation and simulation must be bit-identical on every platform. The standard library
# forwards these to the platform's math library, whose results differ between operating systems
# and versions. Use the `libm` crate (a fixed software implementation) instead. IEEE basic
# operations (+ - * / sqrt, abs, min, max, floor) are exact everywhere and remain allowed.
disallowed-methods = [
    { path = "f32::sin", reason = "platform-dependent result; use libm" },
    { path = "f32::cos", reason = "platform-dependent result; use libm" },
    { path = "f32::tan", reason = "platform-dependent result; use libm" },
    { path = "f32::asin", reason = "platform-dependent result; use libm" },
    { path = "f32::acos", reason = "platform-dependent result; use libm" },
    { path = "f32::atan", reason = "platform-dependent result; use libm" },
    { path = "f32::atan2", reason = "platform-dependent result; use libm" },
    { path = "f32::sinh", reason = "platform-dependent result; use libm" },
    { path = "f32::cosh", reason = "platform-dependent result; use libm" },
    { path = "f32::tanh", reason = "platform-dependent result; use libm" },
    { path = "f32::exp", reason = "platform-dependent result; use libm" },
    { path = "f32::exp2", reason = "platform-dependent result; use libm" },
    { path = "f32::ln", reason = "platform-dependent result; use libm" },
    { path = "f32::log", reason = "platform-dependent result; use libm" },
    { path = "f32::log2", reason = "platform-dependent result; use libm" },
    { path = "f32::log10", reason = "platform-dependent result; use libm" },
    { path = "f32::powf", reason = "platform-dependent result; use libm" },
    { path = "f32::powi", reason = "not guaranteed identical across platforms; multiply explicitly or use libm" },
    { path = "f32::cbrt", reason = "platform-dependent result; use libm" },
    { path = "f32::hypot", reason = "platform-dependent result; use libm" },
    { path = "f64::sin", reason = "platform-dependent result; use libm" },
    { path = "f64::cos", reason = "platform-dependent result; use libm" },
    { path = "f64::tan", reason = "platform-dependent result; use libm" },
    { path = "f64::asin", reason = "platform-dependent result; use libm" },
    { path = "f64::acos", reason = "platform-dependent result; use libm" },
    { path = "f64::atan", reason = "platform-dependent result; use libm" },
    { path = "f64::atan2", reason = "platform-dependent result; use libm" },
    { path = "f64::sinh", reason = "platform-dependent result; use libm" },
    { path = "f64::cosh", reason = "platform-dependent result; use libm" },
    { path = "f64::tanh", reason = "platform-dependent result; use libm" },
    { path = "f64::exp", reason = "platform-dependent result; use libm" },
    { path = "f64::exp2", reason = "platform-dependent result; use libm" },
    { path = "f64::ln", reason = "platform-dependent result; use libm" },
    { path = "f64::log", reason = "platform-dependent result; use libm" },
    { path = "f64::log2", reason = "platform-dependent result; use libm" },
    { path = "f64::log10", reason = "platform-dependent result; use libm" },
    { path = "f64::powf", reason = "platform-dependent result; use libm" },
    { path = "f64::powi", reason = "not guaranteed identical across platforms; multiply explicitly or use libm" },
    { path = "f64::cbrt", reason = "platform-dependent result; use libm" },
    { path = "f64::hypot", reason = "platform-dependent result; use libm" },
    { path = "f32::sin_cos", reason = "platform-dependent result; use libm" },
    { path = "f32::exp_m1", reason = "platform-dependent result; use libm" },
    { path = "f32::ln_1p", reason = "platform-dependent result; use libm" },
    { path = "f32::asinh", reason = "platform-dependent result; use libm" },
    { path = "f32::acosh", reason = "platform-dependent result; use libm" },
    { path = "f32::atanh", reason = "platform-dependent result; use libm" },
    { path = "f64::sin_cos", reason = "platform-dependent result; use libm" },
    { path = "f64::exp_m1", reason = "platform-dependent result; use libm" },
    { path = "f64::ln_1p", reason = "platform-dependent result; use libm" },
    { path = "f64::asinh", reason = "platform-dependent result; use libm" },
    { path = "f64::acosh", reason = "platform-dependent result; use libm" },
    { path = "f64::atanh", reason = "platform-dependent result; use libm" },
]
